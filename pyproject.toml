[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chestxray-cad"
version = "1.0.0"
description = "Reproducible, deployable multi-label chest X-ray classifier."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sivasharmini Ganeshamoorthy" }]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cxr-train = "chestxray.training.train:main"
cxr-eval = "chestxray.evaluate:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
